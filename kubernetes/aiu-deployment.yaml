apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiu
  namespace: iso42001
  labels:
    app: aiu
    component: ui-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aiu
  template:
    metadata:
      labels:
        app: aiu
        component: ui-agent
    spec:
      containers:
        - name: aiu
          image: iso42001/aiu:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8005
              name: http
          env:
            - name: CHROMADB_PATH
              value: /data/chromadb
            - name: LLM_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: iso42001-config
                  key: LLM_PROVIDER
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: iso42001-config
                  key: OLLAMA_BASE_URL
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: iso42001-config
                  key: OLLAMA_MODEL
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: iso42001-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
          volumeMounts:
            - name: chromadb-storage
              mountPath: /data/chromadb
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8005
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: chromadb-storage
          persistentVolumeClaim:
            claimName: chromadb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: aiu
  namespace: iso42001
  labels:
    app: aiu
spec:
  selector:
    app: aiu
  ports:
    - name: http
      port: 8005
      targetPort: 8005
      protocol: TCP
  type: ClusterIP
