apiVersion: apps/v1
kind: Deployment
metadata:
  name: aga
  namespace: iso42001
  labels:
    app: aga
    component: gap-analysis-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aga
  template:
    metadata:
      labels:
        app: aga
        component: gap-analysis-agent
    spec:
      containers:
        - name: aga
          image: iso42001/aga:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
              name: http
          env:
            - name: CHROMADB_PATH
              value: /data/chromadb
            - name: LLM_PROVIDER
              valueFrom:
                configMapKeyRef:
                  name: iso42001-config
                  key: LLM_PROVIDER
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: iso42001-config
                  key: OLLAMA_BASE_URL
            - name: OLLAMA_MODEL
              valueFrom:
                configMapKeyRef:
                  name: iso42001-config
                  key: OLLAMA_MODEL
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: iso42001-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
          volumeMounts:
            - name: chromadb-storage
              mountPath: /data/chromadb
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
      volumes:
        - name: chromadb-storage
          persistentVolumeClaim:
            claimName: chromadb-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: aga
  namespace: iso42001
  labels:
    app: aga
spec:
  selector:
    app: aga
  ports:
    - name: http
      port: 8004
      targetPort: 8004
      protocol: TCP
  type: ClusterIP
