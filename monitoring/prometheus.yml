global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: orchestrator
    static_configs:
      - targets: ["orchestrator:8000"]

  - job_name: as1
    static_configs:
      - targets: ["as1:8001"]

  - job_name: as2
    static_configs:
      - targets: ["as2:8002"]

  - job_name: as3
    static_configs:
      - targets: ["as3:8003"]

  - job_name: aga
    static_configs:
      - targets: ["aga:8004"]

  - job_name: aiu
    static_configs:
      - targets: ["aiu:8005"]
